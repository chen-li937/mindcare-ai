# ===================== Spring 配置 =====================
spring:
  profiles:
    # 激活 local 配置（application-local.yml 存放真实密钥，不入仓库；模板见 application-example.yml）
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/mind_assistant?useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:please-see-application-example.yml}

  # ===================== Spring AI 配置(和 datasource 同级!) =====================
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-please-see-application-example.yml}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

# ===================== 服务器配置 =====================
server:
  port: 1236

# ===================== JWT 配置 =====================
jwt:
  secret: ${JWT_SECRET:please-see-application-example.yml}
  expiration: 86400000
  refreshExpiration: 604800000
  header: Authorization
  token-prefix: "Bearer"
